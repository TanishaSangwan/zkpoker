[package]
name = "zkpoker"
version = "0.1.0"
edition = "2024_07"

[dependencies]
starknet = "2.18.0"

[dev-dependencies]
# Scarb's own bundled test runner. Kept for compatibility, but it no longer
# collects anything: with snforge_std present, snforge's `#[test]` attribute
# macro owns test collection, so `scarb test -- -t unit` (the old documented
# command for src/'s pure-function unit tests) now reports 0 tests. Those 30
# tests still run — `snforge test --features testing` executes them along
# with cairo/tests/, 98 total. Use that single command.
cairo_test = "2.18.0"
# Added: this machine has a real snforge (0.63.0) with a prebuilt plugin, so
# the Windows/no-Rust blocker documented below and in cairo/tests/README.md
# no longer applies here. Verified `scarb build` still succeeds clean with
# this present (see the plain-build note below).
snforge_std = "0.63.0"

[[target.starknet-contract]]
sierra = true
casm = true

[tool.scarb]
allow-prebuilt-plugins = ["snforge_std"]

# `testing` gates src/mocks.cairo (the mock ERC20 that cairo/tests/ needs to
# declare/deploy). NOT enabled by default, so a plain `scarb build` never
# compiles the mock into the production starknet-contract artifacts.
# The suite must be run as: snforge test --features testing
[features]
testing = []

# Historical note (see cairo/tests/README.md for the original writeup): on
# the Windows machine this project started on, snforge_std broke even a
# plain `scarb build` because Scarb resolves the full dependency graph
# (dev-dependencies included) and no prebuilt Windows plugin existed for the
# version tried, so it fell back to `cargo fetch` with no Rust toolchain
# installed. Not an issue on this machine (Linux, prebuilt plugin available)
# — confirmed by re-running `scarb build` after adding this.

# The contract crossed Starknet's 81920-felt CASM ceiling once the blind
# structure landed. `avoid` inlines only trivial bodies, which trades a
# little runtime gas for a large drop in code size -- the right side of that
# trade when the alternative is a contract that cannot be declared at all.
[profile.dev.cairo]
inlining-strategy = "avoid"
