[package]
name = "zkpoker"
version = "0.1.0"
edition = "2024_07"

[dependencies]
starknet = "2.18.0"

[dev-dependencies]
# Safe: cairo_test is Scarb's own bundled test runner (the deprecated-but-
# working `scarb cairo-test` / `scarb test -- -t unit`), not a cargo-built
# plugin — confirmed it does NOT break `scarb build` the way snforge_std
# did (see the note below). This is what runs cairo/src/poker_hand.cairo's
# unit tests; it can't run cairo/tests/ (that needs snforge_std's
# cheatcodes/contract-deployment support), only pure-function unit tests
# co-located in src/.
cairo_test = "2.18.0"

[[target.starknet-contract]]
sierra = true
casm = true

# Test dependencies (snforge_std) are intentionally NOT declared here.
# This machine has no Rust/cargo toolchain, and Scarb resolves the full
# dependency graph — dev-dependencies included — even for a plain `scarb
# build`, so adding snforge_std here breaks the production build the moment
# its companion snforge_scarb_plugin needs `cargo fetch` to resolve (no
# prebuilt Windows plugin was available for the version tried). See
# cairo/tests/README.md for the exact block to add before running the test
# suite on a machine with Rust installed (or under WSL).
